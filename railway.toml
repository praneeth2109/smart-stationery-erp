    # Railway deployment configuration for Smart Stationery ERP backend
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder = "NIXPACKS"
buildCommand = "npm --prefix backend install && npm --prefix backend run build"

[deploy]
startCommand = "cd backend && npx prisma db push && npx tsx prisma/seed.ts && npm start"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
