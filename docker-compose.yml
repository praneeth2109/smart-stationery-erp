version: "3.9"

# ── Smart Stationery ERP — Full Stack Docker Compose ──────────────────────────
#
# Usage:
#   Development:  docker compose up
#   Rebuild:      docker compose up --build
#   Stop:         docker compose down
#   Wipe DB:      docker compose down -v
#
# The backend waits for postgres to be healthy before starting.
# Default admin login: admin@stationeryerp.com / Admin@12345

services:

  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: stationery_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stationery
      POSTGRES_PASSWORD: stationery_pass
      POSTGRES_DB: stationery_erp
    ports:
      - "5432:5432"          # expose so you can connect with pgAdmin / Prisma Studio locally
    volumes:
      - postgres_data:/var/lib/postgresql/data   # data persists across restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stationery -d stationery_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend API (Express + Prisma) ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stationery_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy      # waits until postgres passes health check
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://stationery:stationery_pass@postgres:5432/stationery_erp
      JWT_ACCESS_SECRET: dev-access-secret-change-in-production-min-32-chars
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production-min-32-chars
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN_DAYS: "7"
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Frontend (Next.js static export served by Nginx) ────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the static bundle at build time
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    container_name: stationery_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"             # Nginx listens on 80 inside, mapped to 3000 outside

volumes:
  postgres_data:              # named volume — DB data survives docker compose down
